name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: ruff 检查
        run: |
          pip install ruff
          ruff check .

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 核心逻辑单测（波动/标记引擎，零依赖）
        run: python -m unittest tests.test_core_logic
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 语法编译检查
        run: |
          python -m py_compile "统一日报生成器.py" "统一周报生成器.py" "生成示例报告图片.py"
      - name: 生成示例数据 + dry-run 冒烟
        run: |
          python generate_sample_data.py
          python "统一日报生成器.py" --dry-run --date 2026-6-21
